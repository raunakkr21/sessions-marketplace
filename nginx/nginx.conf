# =============================================================================
# Nginx Reverse Proxy Configuration
# =============================================================================
#
# Routing strategy (see DECISIONS.md):
#   /api/*        → Django/DRF backend (backend:8000)
#   /admin/*      → Django admin (backend:8000)
#   /static/*     → Django static files (backend:8000)
#   /* (all else) → React/Vite frontend (frontend:5173)
#
# This eliminates CORS entirely — all traffic arrives from the same origin.
# The browser sees one host (localhost:80).
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    sendfile on;
    keepalive_timeout 65;

    # ── Upstream Services ────────────────────────────────────────────────────
    upstream backend {
        server backend:8000;
    }

    upstream frontend {
        server frontend:5173;
    }

    # ── Main Server Block ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name localhost;

        # Maximum upload size (for profile updates etc.)
        client_max_body_size 10M;

        # ── API Traffic → Django Backend ─────────────────────────────────────
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for cookies to work correctly through the proxy
            proxy_cookie_path / /;

            # Timeout for long-running requests (e.g., OAuth token exchange)
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # ── Django Admin ──────────────────────────────────────────────────────
        location /admin/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Django Static Files ───────────────────────────────────────────────
        location /static/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            # Cache static files
            expires 1d;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend (React/Vite) ─────────────────────────────────────────────
        # Everything else goes to the Vite dev server.
        # Vite handles its own WebSocket upgrade for HMR.
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for Vite HMR (hot module reload in development)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 300s;
        }
    }
}
